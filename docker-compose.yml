# Deploiement InternatAdmin : PostgreSQL + backend + frontend.
# Seul le frontend est publie sur l'hote (port ${FRONTEND_PORT:-8080}) ; postgres et backend
# ne sont joignables que depuis le reseau interne du compose (le frontend relaie /api vers le backend).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internatadmin}
      POSTGRES_USER: ${POSTGRES_USER:-internatadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-internatadmin} -d ${POSTGRES_DB:-internatadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internatadmin

  backend:
    image: ${BACKEND_IMAGE:-abdoulaye940/daara-backend}:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-internatadmin}
      DB_USERNAME: ${POSTGRES_USER:-internatadmin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SERVER_PORT: 8080
      LOGO_DIR: /data/logos
      PAIEMENT_LOCK_TIMEOUT: ${PAIEMENT_LOCK_TIMEOUT:-5s}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - internatadmin
    # pas de "ports" ici : le backend n'est accessible que via le proxy /api du frontend

  frontend:
    image: ${FRONTEND_IMAGE:-abdoulaye940/daara-frontend}:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - internatadmin

networks:
  internatadmin:

volumes:
  postgres_data:
